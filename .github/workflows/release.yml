name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - Desktop-Fidelity Responsive Speed Test & Theme Alignment
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            - **Latest Bundle**: `netpulse.apk`
            
            ### ✨ What's Fixed & Added in ${{ github.ref_name }}
            - **Responsive Dual-Gauge Speed Test**: Mobile and Android APK now match the desktop-fidelity dual-gauge Download/Upload console with live sparklines and percentile tracking.
            - **Dark Mode Box-Plot Track Contrast**: Fixed bright light-gray tracks in dark mode across Download and Upload payload breakdowns.
            - **Full Mobile Navigation Labels**: Eliminated ellipsis truncation on DIAGNOSTICS in bottom dock.
            - **Ample Mobile Bottom Clearance**: Added bottom clearance ensuring content is never hidden behind floating navigation.
            - **100% In-App Internal APK Self-Updater**: Background APK download and system installation with zero browser redirects.
          files: |
            NetPulse-v0.8.apk
            NetPulse-v0.7.apk
            netpulse.apk
