name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - In-App Internal Updater & Authentic Brand Icon
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            
            ### ✨ What's Fixed & Added in ${{ github.ref_name }}
            - **100% In-App Internal Updater**: Download and trigger system package installer directly inside the app with zero external browser redirects.
            - **Authentic Website Brand Logo**: Integrated the high-definition website Infinity Pulse logo across all Android launcher densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`).
            - **Multi-Server Edge CDN Benchmark**: Compare Cloudflare Anycast, AWS CloudFront, and Google Cloud CDN side-by-side.
            - **Live Gaming Latency Oscilloscope**: Continuous real-time ping stability monitor.
            - **Midnight OLED Dark Mode**: Pure black OLED theme with instant header toggle.
            - **Wi-Fi & Channel Health Analyzer**: Real-time link speed and channel band diagnostics.
            - **Scheduled Background Routine**: Automated tests and custom minimum speed threshold alerts.
          files: |
            NetPulse-v0.4.apk
            netpulse.apk
