name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - Professional Network Diagnostics Suite
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            - **Latest Universal Bundle**: `netpulse.apk`
            
            ### ✨ The 8 Professional Network Diagnostic Features in ${{ github.ref_name }}
            - **Bufferbloat Letter Grade (A+ to F)**: Automated loaded latency delta grading on speed console & certificate.
            - **DNS Resolver Speed Shootout (DoH)**: Live DoH query benchmark (Cloudflare vs Google vs Quad9 vs OpenDNS).
            - **VoIP / WebRTC MOS Audio Score (1.0 to 4.5)**: ITU-T G.107 standard Mean Opinion Score calculation.
            - **25-Probe Timeline Packet Loss Logger**: Micro-burst drop detection and individual packet RTT visualization.
            - **IPv4 vs IPv6 Dual-Stack Routing Duel**: Direct protocol comparison with carrier CGNAT detection.
            - **Path MTU & Packet Fragmentation Analyzer**: PMTUD frame boundary analysis across 1420B, 1492B, 1500B, 1508B.
            - **Visual Hop-by-Hop Edge Route Trace**: BGP Autonomous System (ASN) and IATA airport colocation tracking.
            - **Wi-Fi RF Signal & Link Analyzer**: Calibrated RSSI signal meter (-dBm) and Signal-to-Noise Ratio (SNR).
          files: |
            NetPulse-v0.9.apk
            NetPulse-v0.8.apk
            netpulse.apk
