name: Release NetPulse APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Verify Web Build
        run: |
          npm ci
          npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..
          mkdir -p release
          TAG_OR_VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1' }}"
          cp android/app/build/outputs/apk/release/app-release.apk "NetPulse-${TAG_OR_VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release/NetPulse-${TAG_OR_VERSION}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - Enterprise Edge Network Telemetry & Diagnostics

            ### 📦 Download Release Asset
            - **Android APK (Direct Install)**: [NetPulse-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NetPulse-${{ github.ref_name }}.apk)
            
            ### ✨ Highlights in NetPulse ${{ github.ref_name }}
            - 🏎️ **100% Native Jetpack Compose Architecture**: Engineered completely in idiomatic Kotlin with hardware-accelerated Canvas speedometer and real-time spline graphs.
            - 📶 **Real-Time Bufferbloat Loaded Latency Engine**: True active saturation delta (download loaded latency & upload loaded latency) with Waveform-grade letter grading (A+ to F).
            - 🔐 **DNS-over-HTTPS (DoH) Resolver Shootout**: Direct latency comparison across Cloudflare, Google, Quad9, and OpenDNS.
            - 📡 **VoIP & WebRTC MOS Score**: ITU-T G.107 Mean Opinion Score calculation for real-time call and video conferencing fidelity.
            - 🔄 **In-App OTA Engine**: Native in-app update checking and installation signed with permanent keystore (valid through 2054).
          files: |
            NetPulse-${{ github.ref_name }}.apk
