name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - Website Tab Icon & Midnight OLED Fixes
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            - **Latest Bundle**: `netpulse.apk`
            
            ### ✨ What's Fixed & Added in ${{ github.ref_name }}
            - **Website Tab Logo Launcher Icon**: Android APK now uses the authentic website tab gradient Infinity Pulse emblem across standard, round, and adaptive launcher densities.
            - **Seamless Light & Dark Backgrounds**: Full contrast and OLED pure black support across all settings, dropdowns, cards, oscilloscope, and history tables.
            - **100% In-App Internal Updater**: Background APK download and system installation with zero external browser redirects.
            - **Multi-Server Edge CDN Benchmark**: Compare Cloudflare Anycast, AWS CloudFront, and Google Cloud CDN.
            - **Live Latency Oscilloscope & Wi-Fi Diagnostic**: Real-time jitter, packet drops, and channel band metrics.
          files: |
            NetPulse-v0.5.apk
            NetPulse-v0.4.apk
            netpulse.apk
