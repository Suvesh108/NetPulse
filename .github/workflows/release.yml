name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - Vector Ribbon Logo & Theme Synchronization
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            - **Latest Bundle**: `netpulse.apk`
            
            ### ✨ What's Fixed & Added in ${{ github.ref_name }}
            - **Circular Infinity Pulse Vector Ribbon Logo**: Modern 3D folded gradient ribbon brand logo across website header, tab favicon, PWA icons, and Android APK launcher.
            - **Seamless Light & Midnight OLED Themes**: High contrast and pure OLED `#030712` dark mode support across all components.
            - **100% In-App Internal APK Self-Updater**: Direct background downloads and installation with zero browser redirects.
            - **Multi-Server Edge CDN Benchmark**: Live Cloudflare, AWS CloudFront, and Google Cloud CDN speed comparison.
            - **Live Latency Oscilloscope & Wi-Fi Diagnostic**: Continuous ping stability, packet loss, and channel band metrics.
          files: |
            NetPulse-v0.6.apk
            NetPulse-v0.5.apk
            netpulse.apk
