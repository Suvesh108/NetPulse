name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - Adaptive Icon & Theme Contrast Fixes
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            - **Latest Bundle**: `netpulse.apk`
            
            ### ✨ What's Fixed & Added in ${{ github.ref_name }}
            - **Adaptive Icon Fix**: Fixed white launcher circle on Android home screen by integrating a sleek `#0B1120` midnight disc and centered foreground safe-zone emblem.
            - **Theme & Contrast Synchronization**: Added Tailwind CSS v4 `@custom-variant dark` for full sync between light and dark mode backgrounds, borders, and cards.
            - **Enhanced Header Branding**: High-contrast brand typography and 3D vector ribbon logo in header.
            - **100% In-App Internal APK Self-Updater**: Background APK download and system installation with zero browser redirects.
            - **Live Latency Oscilloscope & Wi-Fi Diagnostic**: Continuous ping stability, packet loss, and channel band metrics.
          files: |
            NetPulse-v0.7.apk
            NetPulse-v0.6.apk
            netpulse.apk
