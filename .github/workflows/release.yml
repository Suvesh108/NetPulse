name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }}
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            
            ### ✨ What's New in ${{ github.ref_name }}
            - **In-App Direct Updater**: Check for updates and download/install new releases directly from Settings without using Chrome.
            - **Native Infinity Pulse Icon**: Brand vector icon integrated across all Android launcher densities.
            - **Dynamic Speedometer Colors**: Real-time phase color switching (Orange for Download, Purple for Upload).
            - **Security Hardened**: Defensive HTTPS transport, backup protection, and USB debugging lockdown.
          files: |
            NetPulse-v0.2.apk
            netpulse.apk
