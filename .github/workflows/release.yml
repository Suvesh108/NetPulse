name: Release NetPulse APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetPulse ${{ github.ref_name }}
          body: |
            ## 🚀 NetPulse ${{ github.ref_name }} - Major Feature & SEO Release
            
            ### 📦 Download Assets
            - **Android APK (Direct Install)**: `NetPulse-${{ github.ref_name }}.apk`
            
            ### ✨ What's New in ${{ github.ref_name }}
            - **Multi-Server Edge CDN Benchmark**: Compare Cloudflare Anycast, AWS CloudFront, and Google Cloud CDN side-by-side.
            - **Shareable Speed Certificate**: Export high-resolution PNG speed cards with verified badges.
            - **Live Gaming Latency Oscilloscope**: Continuous real-time ping and jitter stability monitor.
            - **Midnight OLED Dark Mode**: Pure black OLED theme with instant header toggle.
            - **Wi-Fi & Channel Health Analyzer**: Real-time link speed and channel band diagnostics.
            - **Scheduled Background Routine**: Automated tests and custom minimum speed threshold alerts.
            - **In-App APK Direct Updater**: Background APK updates directly within Settings.
          files: |
            NetPulse-v0.3.apk
            netpulse.apk
