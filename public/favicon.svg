<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tabFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- High-Visibility Infinity Pulse Glyph for 16px/32px Tab Tile Slots -->
  <!-- Continuous Figure-8 Infinity Loop with Integrated Velocity Pulse -->
  <path
    d="M 50,50 
       C 38,18 10,18 10,50 
       C 10,82 38,82 50,50 
       C 62,18 90,18 90,50 
       C 90,82 62,82 50,50 Z"
    stroke="url(#tabFaviconGrad)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Concentric Inner Infinity Track -->
  <path
    d="M 50,50 
       C 42,28 22,28 22,50 
       C 22,72 42,72 50,50 
       C 58,28 78,28 78,50 
       C 78,72 58,72 50,50 Z"
    stroke="#60A5FA"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.8"
  />

  <!-- Central High-Contrast Velocity Pulse Notch -->
  <path
    d="M 36,50 L 43,30 L 57,70 L 64,50"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
